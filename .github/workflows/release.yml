# Release: construye y publica la imagen del puente en GitHub Container Registry.
# La imagen se consume en alexabridge.container / compose.yml como
# ghcr.io/atareao/alexa-music:latest.
name: Release

on:
  push:
    branches: [main, development]
    tags: ['v*']

# Serializa las publicaciones: una nueva push espera a que termine la anterior
# en lugar de cancelar una subida de imagen a mitad de proceso.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents: read para el checkout; packages: write para publicar en GHCR.
    permissions:
      contents: read
      packages: write
    steps:
      # Checkout del código fuente.
      - uses: actions/checkout@v4

      # Prepara QEMU y Buildx para builds multi-arquitectura.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Login en GHCR con el token efímero del workflow (sin secretos manuales).
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Genera etiquetas y metadatos de la imagen.
      # latest solo se publica cuando el branch por defecto del repo es main.
      - name: Extraer metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/atareao/alexa-music
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=sha

      # Construye el Containerfile multi-stage y sube la imagen a GHCR,
      # reutilizando la caché de capas de GitHub Actions.
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
